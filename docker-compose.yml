# 番茄每日完结小说抓取 · 绿联 NAS 部署
# 使用：docker compose up -d --build
services:
  fanqie-completed-crawler:
    build: .
    image: fanqie-completed-crawler:latest
    container_name: fanqie-completed-crawler
    ports:
      - "8787:8787"          # NAS 上若 8787 被占用，改左边那个，如 "8899:8787"
    volumes:
      - ./output:/app/output  # 结果 JSON 与调度配置持久化到项目目录下的 output/
    environment:
      - PORT=8787
    restart: unless-stopped   # 崩溃/NAS 重启后自动拉起，保证每晚 23:50 定时任务不缺席
    shm_size: 512m            # Chrome 稳定运行余量（脚本本身已带 --disable-dev-shm-usage）
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||8787)+'/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
